[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cookbook_utils"
version = "0.1.0"
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "geopandas",
    "pytest",
]

#[tool.setuptools.packages.find]
#where = ["src"]  # Look for packages in the 'src' directory

[tool.pytest.ini_options]
testpaths = ["tests"]
